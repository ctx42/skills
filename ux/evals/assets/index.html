<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <span class="brand">Tasks</span>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html" aria-current="page">Today</a>
      <a href="archive.html">Archive</a>
      <a href="settings.html">Settings</a>
    </nav>
  </header>
  <main>
    <h1>Today</h1>
    <form id="add-form" class="add-form">
      <div>
        <label for="new-title">New task</label>
        <input type="text" id="new-title" name="title">
      </div>
      <button type="submit">Add</button>
    </form>
    <p id="status" class="status">Loading…</p>
    <ul id="tasks" class="task-list" data-source="data/tasks.json" data-editable></ul>
  </main>
  <footer class="site-footer">Tasks keeps your list in this browser only.</footer>
  <script src="tasks.js"></script>
  <script src="app.js"></script>
</body>
</html>
